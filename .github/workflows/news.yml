name: Daily News Sentiment Opportunities

on:
  # Standalone scheduling is opt-in. The existing Telegram repository is the
  # default scheduled caller so its encrypted credentials can stay there.
  schedule:
    - cron: '30 7 * * *'
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      smoke:
        description: Limited live source check (never sends Telegram)
        type: boolean
        default: true
      send_telegram:
        description: Deliver a full report to the configured private chat
        type: boolean
        default: false
  workflow_call:
    inputs:
      smoke:
        type: boolean
        default: false
      send_telegram:
        type: boolean
        default: true
      code_ref:
        type: string
        default: main
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: news-sentiment-daily
  cancel-in-progress: false

jobs:
  report:
    if: >-
      !github.event.repository.private &&
      (github.repository == 'eladyesh/stock-screener-daily' ||
       github.event_name != 'schedule' || vars.NEWS_STANDALONE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      SMOKE: ${{ inputs.smoke || false }}
      SEND_TELEGRAM: ${{ github.event_name == 'schedule' || inputs.send_telegram }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: eladyesh/stock-news-sentiment-daily
          ref: ${{ inputs.code_ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install local CPU sentiment model dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Restore observation history and delivery journal
        id: history
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: news-sentiment-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-sentiment-history-v1-
      - name: Verify the destination without sending
        if: env.SEND_TELEGRAM == 'true' && env.SMOKE != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m news_scout verify-telegram
      - name: Discover, investigate and rank stock opportunities
        id: research
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$SMOKE" == 'true' ]]; then args+=(--smoke); fi
          if [[ "$SEND_TELEGRAM" == 'true' && "$SMOKE" != 'true' ]]; then args+=(--prepare-delivery); fi
          python -m news_scout run "${args[@]}"
      - name: Hold the completed scheduled report until 08:00 Israel time
        if: github.event_name == 'schedule' && env.SMOKE != 'true'
        run: python -m news_scout wait-for-delivery
      - name: Deliver the English report
        if: steps.research.outcome == 'success' && env.SEND_TELEGRAM == 'true' && env.SMOKE != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m news_scout send
      - name: Preserve the journal, including uncertain sends
        if: always() && env.SEND_TELEGRAM == 'true' && env.SMOKE != 'true'
        uses: actions/cache/save@v4
        with:
          path: state/
          key: news-sentiment-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain this run's report and coverage metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-sentiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
