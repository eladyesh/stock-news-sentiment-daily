name: Daily News Sentiment Opportunities

on:
  # Run in this repository every day; timezone follows Israel's DST changes.
  schedule:
    - cron: '46 7 * * *'
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      smoke:
        description: Limited live source check (never sends Telegram)
        type: boolean
        default: true
      send_telegram:
        description: Deliver a full report to the configured private chat
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news-sentiment-daily
  cancel-in-progress: false

jobs:
  report:
    if: >-
      !github.event.repository.private &&
      github.repository == 'eladyesh/stock-news-sentiment-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      SMOKE: ${{ inputs.smoke || false }}
      SEND_TELEGRAM: ${{ github.event_name == 'schedule' || inputs.send_telegram }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify this repository's Telegram destination without sending
        if: env.SEND_TELEGRAM == 'true' && env.SMOKE != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in stock-news-sentiment-daily > Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m news_scout verify-telegram
      - name: Install local CPU sentiment model dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Restore observation history and delivery journal
        id: history
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: news-sentiment-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-sentiment-history-v1-
      - name: Recover the reviewed first-send rejection from run 39030650204
        if: >-
          github.event_name == 'workflow_dispatch' &&
          env.SEND_TELEGRAM == 'true' && env.SMOKE != 'true' &&
          steps.history.outputs.cache-matched-key == 'news-sentiment-history-v1-39030650204-1'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from news_scout.core import digest
          from news_scout.report import render
          from news_scout.telegram import atomic_json, split_messages
          
          state_path = Path("state/state.json")
          state = json.loads(state_path.read_text())
          report = json.loads(Path("state/pending_report.json").read_text())
          delivery = state.get("delivery", {}).get("2026-10-17", {})
          expected = digest(json.dumps(split_messages(render(report)), ensure_ascii=False))
          if (report.get("date") != "2026-10-17"
                  or report.get("smoke") or report.get("synthetic")
                  or delivery.get("cursor") != 0
                  or delivery.get("uncertain") is not True
                  or delivery.get("complete")
                  or delivery.get("last_message_id") is not None
                  or delivery.get("fingerprint") != expected):
              raise RuntimeError("Recovery refused: journal does not match the reviewed first-send rejection")
          # Run 39030650204/1 received HTTP 403 on its first sendMessage.
          # Run 39031287088 confirmed that the old destination was the bot itself.
          # No report message was accepted. Preserve the exact report and cursor.
          delivery["uncertain"] = False
          delivery["reviewed_rejection"] = {"run_id": 39030650204, "attempt": 1, "http_status": 403}
          atomic_json(state_path, state)
          print("Recovered the reviewed HTTP 403 rejection; no message sent by recovery.")
          PY
      - name: Discover, investigate and rank stock opportunities
        id: research
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$SMOKE" == 'true' ]]; then args+=(--smoke); fi
          if [[ "$SEND_TELEGRAM" == 'true' && "$SMOKE" != 'true' ]]; then args+=(--prepare-delivery); fi
          python -m news_scout run "${args[@]}"
      - name: Hold the completed scheduled report until 08:00 Israel time
        if: github.event_name == 'schedule' && env.SMOKE != 'true'
        run: python -m news_scout wait-for-delivery
      - name: Deliver the English report
        if: steps.research.outcome == 'success' && env.SEND_TELEGRAM == 'true' && env.SMOKE != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m news_scout send
      - name: Preserve the journal, including uncertain sends
        if: always() && env.SEND_TELEGRAM == 'true' && env.SMOKE != 'true'
        uses: actions/cache/save@v4
        with:
          path: state/
          key: news-sentiment-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain this run's report and coverage metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-sentiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
